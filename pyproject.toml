[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-job-demo"
version = "0.1.0"
description = "Databricks MLflow synthetic regression job demo"
requires-python = ">=3.10"
dependencies = [
    "mlflow",
    "scikit-learn",
    "pandas",
    "numpy",
]

[project.scripts]
mlflow-job-demo-train = "mlflow_job_demo.train:main"

[tool.setuptools.packages.find]
where = ["src"]
